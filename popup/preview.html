<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat Export Preview</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png" />
    <link rel="shortcut icon" href="/icons/favicon.ico" />
    <link rel="stylesheet" href="preview.css" />
    <script src="../content/lib/html2canvas.min.js"></script>
  </head>
  <body>
    <div class="preview-container">
      <header class="preview-header">
        <div class="header-top-row">
          <div class="header-main">
            <span class="badge" data-i18n="previewWorkspaceBadge">Chat Export Workspace</span>
            <h1 id="preview-title">Chat Title</h1>
          </div>
          <div class="action-buttons">
            <button id="feedback-btn" class="btn secondary-btn" title="Open feedback guidance">
              <span data-i18n="feedback">Feedback</span>
            </button>
            <button
              id="github-issue-btn"
              class="btn secondary-btn"
              title="Report issue on GitHub (prefilled with page details)"
              aria-label="Report issue on GitHub"
            >
              <svg viewBox="0 0 24 24" class="icon" aria-hidden="true">
                <path
                  d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"
                />
              </svg>
            </button>
            <button id="print-btn" class="btn secondary-btn hidden">
              <svg viewBox="0 0 24 24" class="icon">
                <path
                  d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"
                />
              </svg>
              <span data-i18n="printSavePdf">Print / Save PDF</span>
            </button>
            <button id="copy-btn" class="btn secondary-btn">
              <svg viewBox="0 0 24 24" class="icon">
                <path
                  d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"
                />
              </svg>
              <span data-i18n="copyCode">Copy Code</span>
            </button>
            <button id="download-btn" class="btn primary-btn">
              <svg viewBox="0 0 24 24" class="icon">
                <path
                  d="M19 12v7H5v-7H3v7c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-7h-2zm-6 .67l2.59-2.58L17 11.5l-5 5-5-5 1.41-1.41L11 12.67V3h2v9.67z"
                />
              </svg>
              <span id="download-btn-text" data-i18n="downloadFile">Download File</span>
            </button>
          </div>
        </div>

        <div id="generic-article-notice" class="generic-article-notice hidden">
          <span class="notice-text">
            ⚠️ Extracted as a generic web page. Is this an AI chat platform?
          </span>
          <button id="preview-request-support-btn" class="notice-link-btn">
            Request Platform Support ↗
          </button>
        </div>

        <div class="header-toolbar">
          <div id="format-tabs" class="segmented-control">
            <button data-tab="html-render" class="control-btn active" data-i18n="htmlLiveTab">
              🎨 HTML Live
            </button>
            <button data-tab="html-source" class="control-btn" data-i18n="htmlCodeTab">
              📄 HTML Code
            </button>
            <button data-tab="markdown" class="control-btn" data-i18n="markdownTab">
              📝 Markdown
            </button>
            <button data-tab="text" class="control-btn" data-i18n="textTab">📄 Plain Text</button>
            <button data-tab="json" class="control-btn" data-i18n="jsonTab">⚙️ JSON</button>
            <button data-tab="doc" class="control-btn" data-i18n="wordDocTab">
              📄 Word (.doc)
            </button>
            <button data-tab="png" class="control-btn" data-i18n="imageTab">🖼️ Image (.png)</button>
          </div>

          <div class="theme-control-group">
            <span class="transfer-label">Theme:</span>
            <select id="preview-theme-select" class="transfer-select" title="Switch Theme">
              <option value="system">🎨 System Theme</option>
              <option value="modern-light">☀️ Modern Light</option>
              <option value="modern-dark">🌙 Modern Dark</option>
              <option value="github-light">🐙 GitHub Light</option>
              <option value="github-dark">🐙 GitHub Dark</option>
              <option value="nord">❄️ Nord Slate</option>
              <option value="dracula">🧛 Dracula</option>
              <option value="solarized-light">🌅 Solarized Light</option>
              <option value="solarized-dark">🌌 Solarized Dark</option>
              <option value="catppuccin">🌸 Catppuccin Mocha</option>
              <option value="monokai">⚡ Monokai</option>
              <option value="synthwave">🌆 Synthwave '84</option>
              <option value="gruvbox">📻 Gruvbox</option>
            </select>
          </div>
          <div class="options-menu-group">
            <button
              id="options-menu-btn"
              class="transfer-select options-menu-btn"
              title="Export Options"
              aria-haspopup="true"
              aria-expanded="false"
            >
              ⚙️ <span data-i18n="exportOptions">Options</span>
            </button>
            <div id="options-menu" class="options-menu hidden" role="menu">
              <label class="options-menu-item checkbox-label" style="cursor: pointer">
                <input type="checkbox" id="include-images-checkbox" checked />
                <span data-i18n="includeImages">Include Images</span>
              </label>
              <label class="options-menu-item checkbox-label" style="cursor: pointer">
                <input type="checkbox" id="include-attachments-checkbox" checked />
                <span data-i18n="includeAttachments">Include Files</span>
              </label>
              <label class="options-menu-item checkbox-label" style="cursor: pointer">
                <input type="checkbox" id="include-thinking-checkbox" checked />
                <span data-i18n="includeThinking">Include Thoughts</span>
              </label>
              <label class="options-menu-item checkbox-label" style="cursor: pointer">
                <input type="checkbox" id="include-timestamps-checkbox" />
                <span data-i18n="includeTimestamps">Include Dates</span>
              </label>
              <label class="options-menu-item checkbox-label" style="cursor: pointer">
                <input type="checkbox" id="include-toc-checkbox" />
                <span data-i18n="includeToc">Include Table of Contents</span>
              </label>
              <label
                class="options-menu-item checkbox-label"
                id="png-quality-container"
                style="cursor: pointer"
              >
                <input type="checkbox" id="png-quality-checkbox" checked />
                <span data-i18n="highQualityPng">High Quality PNG (2x)</span>
              </label>
              <div class="options-menu-item options-menu-numbering">
                <span class="transfer-label" data-i18n="messageNumberingLabel">Numbering:</span>
                <select
                  id="preview-numbering-select"
                  class="transfer-select"
                  title="Message Numbering"
                >
                  <option value="off" data-i18n="messageNumberingOff">Off</option>
                  <option value="per-message" data-i18n="messageNumberingPerMessage">
                    Per Message
                  </option>
                  <option value="per-turn" data-i18n="messageNumberingPerTurn">Per Turn</option>
                </select>
              </div>
            </div>
          </div>

          <div class="transfer-control-group">
            <span class="transfer-label" data-i18n="continueOn">Continue On:</span>
            <select
              id="transfer-target-select"
              class="transfer-select"
              title="Transfer Chat Context To"
            >
              <optgroup label="AI chats" data-i18n-label="transferGroupAiChats">
                <option value="claude">Claude</option>
                <option value="chatgpt">ChatGPT</option>
                <option value="gemini">Gemini</option>
                <option value="deepseek">DeepSeek</option>
                <option value="perplexity">Perplexity</option>
                <option value="qwen">Qwen</option>
                <option value="mistral">Mistral</option>
                <option value="lumo">Lumo</option>
                <option value="copilot">Copilot</option>
                <option value="meta">Meta AI</option>
                <option value="z_ai">Z.ai</option>
                <option value="grok">Grok</option>
              </optgroup>
              <optgroup label="Note apps" data-i18n-label="transferGroupNoteApps">
                <option value="obsidian">Obsidian</option>
                <option value="logseq">Logseq</option>
                <option value="bear">Bear</option>
                <option value="noteplan">NotePlan</option>
                <option value="drafts">Drafts</option>
              </optgroup>
            </select>
            <button
              id="transfer-btn"
              class="btn transfer-btn-highlight"
              title="Transfer conversation context to another AI"
              data-i18n-title="transferTooltip"
            >
              <svg viewBox="0 0 24 24" class="icon">
                <path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z" />
              </svg>
              <span data-i18n="transferBtn">Transfer</span>
            </button>
          </div>
        </div>

        <div id="png-warning-banner" class="png-warning-banner hidden" data-i18n="pngWarning">
          ⚠️ PNG export on long chats may take 1–2 minutes. Consider PDF or Markdown for instant
          export.
        </div>
      </header>

      <main class="preview-main">
        <div class="code-wrapper" id="code-wrapper">
          <pre><code id="preview-code" data-i18n="loadingContent">Loading content...</code></pre>
        </div>
        <div class="render-wrapper hidden" id="render-wrapper">
          <iframe
            id="preview-rendered"
            sandbox="allow-scripts allow-modals allow-same-origin"
          ></iframe>
        </div>
      </main>
    </div>
    <script type="module" src="preview.js"></script>
  </body>
</html>
