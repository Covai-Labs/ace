# SonarCloud configuration for Automatic Analysis

# Exclude vendored third-party libraries and documentation/marketing site from analysis
sonar.exclusions=content/lib/**,web/**,dist/**,dist-firefox/**,.output/**

# Exclude tests and mirrored locale files from code duplication (CPD) checks
sonar.cpd.exclusions=tests/**,_locales/**,public/_locales/**,entrypoints/**,options/**,popup/**,sidepanel/**

# Designate test directories
sonar.tests=tests,e2e
