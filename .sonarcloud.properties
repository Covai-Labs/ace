# SonarCloud configuration for Automatic Analysis

# Explicitly define source and test roots so paths do not overlap
sonar.sources=entrypoints,content,public/content,scripts,packages/decant-core/ai,packages/decant-core/detection,packages/decant-core/web,packages/decant-core/utils
sonar.tests=tests,e2e,packages/decant-core/tests

# Exclude vendored third-party libraries, test fixtures, and documentation/marketing site from analysis
sonar.exclusions=content/lib/**,public/content/lib/**,packages/decant-core/lib/**,packages/decant-core/web-docs/**,web/**,dist/**,dist-firefox/**,.output/**,tests/fixtures/**,packages/decant-core/tests/fixtures/**
sonar.test.exclusions=tests/fixtures/**,packages/decant-core/tests/fixtures/**

# Exclude tests and mirrored files from code duplication (CPD) checks
sonar.cpd.exclusions=tests/**,e2e/**,public/_locales/**,entrypoints/**,packages/decant-core/tests/**,public/content/chatgpt_helper.js
