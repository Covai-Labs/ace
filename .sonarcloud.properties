# SonarCloud configuration for Automatic Analysis

# Exclude vendored third-party libraries, test fixtures, and documentation/marketing site from analysis
sonar.exclusions=content/lib/**,public/content/lib/**,tests/fixtures/**,packages/decant-core/tests/fixtures/**,packages/decant-core/lib/**,packages/decant-core/web-docs/**,web/**,dist/**,dist-firefox/**,.output/**

# Exclude tests and mirrored locale files from code duplication (CPD) checks
sonar.cpd.exclusions=tests/**,_locales/**,public/_locales/**,entrypoints/**,options/**,popup/**,sidepanel/**,packages/decant-core/tests/**

# Designate test directories
sonar.tests=tests,e2e,packages/decant-core/tests
