name: 'CodeQL'

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  codeql:
    uses: Covai-Labs/.github/.github/workflows/reusable-codeql.yml@69216b853a78124199cf01649eec6c3f5a512b23 # main
    with:
      config-file: ./.github/codeql/codeql-config.yml
    permissions:
      security-events: write
      actions: read
      contents: read
