name: 'CodeQL'

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  codeql:
    uses: Covai-Labs/.github/.github/workflows/reusable-codeql.yml@bd2d14e6167b4b9fda6767c42e14a5e2648bcdc3 # main
    with:
      config-file: ./.github/codeql/codeql-config.yml
    permissions:
      security-events: write
      actions: read
      contents: read
