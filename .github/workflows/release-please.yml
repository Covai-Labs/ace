name: Release Please & Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: 'Select browser target to publish (or build only)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - chrome
          - edge
          - firefox
          - none

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

  build-and-release:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name || github.ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'npm'
          cache-dependency-path: package.json

      - name: Install dependencies
        run: |
          npm ci
          npm install decant-core@latest --no-save

      - name: Run lint & formatting checks
        run: |
          npm run lint
          npm run format:check

      - name: Build and package extensions with WXT
        run: |
          npm run build
          npm run zip
          npm run build:edge
          npm run zip:edge
          npm run build:firefox
          npm run zip:firefox

      - name: Run tests (including manifest version check)
        run: npm test

      - name: Generate SHA256 Checksums
        run: |
          cd .output
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: extensions
          path: .output/
          include-hidden-files: true

      - name: Attach Extension Zips to GitHub Release
        if: needs.release-please.outputs.release_created == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: |
            .output/ai-chat-exporter-chromium.zip
            .output/ai-chat-exporter-edge.zip
            .output/ai-chat-exporter-firefox.zip
            .output/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-firefox:
    needs: [release-please, build-and-release]
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && needs.release-please.outputs.release_created == 'true') ||
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'firefox'))
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name || github.ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install dependencies
        run: |
          npm ci
          npm install decant-core@latest --no-save

      - name: Build Firefox extension with WXT
        run: npm run build:firefox

      - name: Publish to Firefox Add-ons (AMO)
        run: |
          npx web-ext sign \
            --api-key="${{ secrets.AMO_JWT_ISSUER }}" \
            --api-secret="${{ secrets.AMO_JWT_SECRET }}" \
            --channel="listed" \
            --approval-timeout=0 \
            --source-dir=".output/firefox-mv3"

  publish-edge:
    needs: [release-please, build-and-release]
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && needs.release-please.outputs.release_created == 'true') ||
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'edge'))
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name || github.ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: extensions
          path: .output/

      - name: Publish to Microsoft Edge Add-ons
        run: node publish-edge.js
        env:
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_ZIP_PATH: .output/*-edge.zip

  publish-chrome:
    needs: [release-please, build-and-release]
    runs-on: ubuntu-latest
    concurrency:
      group: publish-chrome-store
      cancel-in-progress: false
    if: |
      (github.event_name == 'push' && needs.release-please.outputs.release_created == 'true') ||
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'chrome'))
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name || github.ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: extensions
          path: .output/

      - name: Publish to Chrome Web Store
        run: node publish-chrome.js
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          CHROME_ZIP_PATH: .output/*-chromium.zip
