<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="sidepanelTitle">AI Chat Exporter Side Panel</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <div class="sp-container">
      <header class="sp-header">
        <div class="sp-brand">
          <span class="sp-icon">⚡</span>
          <span class="sp-title" data-i18n="optionsHeaderTitle">AI Chat Exporter</span>
        </div>
        <div class="sp-header-actions">
          <div id="sp-status" class="sp-status-badge" data-i18n="statusDetecting">Detecting...</div>
          <button
            id="sp-refresh-btn"
            class="sp-icon-btn"
            title="Refresh panel"
            aria-label="Refresh panel"
            data-i18n-title="sidepanelRefresh"
            data-i18n-aria-label="sidepanelRefresh"
          >
            ↻
          </button>
        </div>
      </header>

      <nav class="sp-tabs">
        <button class="sp-tab-btn active" data-tab="export-tab" data-i18n="tabExport">
          Export
        </button>
        <button class="sp-tab-btn" data-tab="settings-tab" data-i18n="tabSettings">Settings</button>
      </nav>

      <main class="sp-content">
        <!-- TAB 1: EXPORT -->
        <section id="export-tab" class="sp-tab-content active">
          <iframe id="sp-export-iframe" class="sp-tab-iframe" src="popup.html"></iframe>
        </section>

        <!-- TAB 2: SETTINGS -->
        <section id="settings-tab" class="sp-tab-content">
          <iframe id="sp-settings-iframe" class="sp-tab-iframe" src="options.html"></iframe>
        </section>
      </main>

      <div id="sp-disabled-notice" class="sp-disabled-notice" style="display: none">
        <div class="sp-disabled-card">
          <span class="sp-disabled-icon">⚡</span>
          <h2 class="sp-disabled-title">Sidebar is Disabled</h2>
          <p class="sp-disabled-text">
            Firefox sidebar is currently disabled in Settings. Enable "Firefox Browser Sidebar" in
            Options to use it here.
          </p>
          <button id="sp-disabled-settings-btn" class="sp-btn-primary">Open Settings</button>
        </div>
      </div>
    </div>
    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
